[package]
name = "vidshrink"
version = "0.1.0"
edition = "2021"
description = "High-performance video compressor and universal image format conversion engine powered by Rust, FFmpeg, and resvg"

[[bin]]
name = "vidshrink"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4.18", features = ["derive"] }
anyhow = "1.0.75"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
regex = "1.10.2"
indicatif = "0.17.7"
colored = "2.1.0"
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tempfile = "3.8"
redis = { version = "0.24", features = ["tokio-comp", "aio"] }
deadpool-redis = "0.14"
futures-util = "0.3"
uuid = { version = "1.6", features = ["v4"] }
image = { version = "0.24", default-features = true }
webp = "0.3"
resvg = "0.44"

[profile.release]
opt-level = 3
lto = true